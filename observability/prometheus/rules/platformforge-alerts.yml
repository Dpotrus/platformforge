groups:
  - name: platformforge-api
    rules:
      - alert: PlatformAPIHighErrorRate
        expr: |
          (
            sum(
              rate(
                platformforge_http_requests_total{
                  status_code=~"5.."
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                rate(platformforge_http_requests_total[5m])
              ),
              0.001
            )
          ) > 0.05
          and
          sum(
            increase(platformforge_http_requests_total[5m])
          ) >= 10
        for: 2m
        labels:
          severity: warning
          service: platform-api
        annotations:
          summary: "Platform API has a high HTTP 5xx error rate"
          description: "More than 5% of HTTP requests returned 5xx responses over the last five minutes, with at least 10 requests observed."