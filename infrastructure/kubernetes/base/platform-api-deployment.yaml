
apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-api
  namespace: platformforge
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: platformforge

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: platformforge

    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: platform-api
          image: registry.gitlab.com/daxthetax/platformforge/platform-api:496739e2b7f7bbe41cd90b220091e55f329dd7f5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: development

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-api-db
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
