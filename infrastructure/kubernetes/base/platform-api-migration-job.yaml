
apiVersion: batch/v1
kind: Job

metadata:
  name: platform-api-migration
  namespace: platformforge
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: platformforge

spec:
  backoffLimit: 2

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: platformforge

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: alembic
          image: registry.gitlab.com/daxthetax/platformforge/platform-api:496739e2b7f7bbe41cd90b220091e55f329dd7f5
          imagePullPolicy: IfNotPresent

          command:
            - alembic
            - upgrade
            - head

          env:
            - name: ENVIRONMENT
              value: development

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-api-db
                  key: DATABASE_URL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
