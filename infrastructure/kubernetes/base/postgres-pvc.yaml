
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-data
  namespace: platformforge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: platformforge

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: standard

  resources:
    requests:
      storage: 2Gi
