apiVersion: v1
kind: Service

metadata:
  name: platform-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: platformforge

spec:
  type: {{ .Values.service.type }}

  selector:
    app.kubernetes.io/name: platform-api

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
