apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api
  namespace: argocd
  labels:
    platformforge.io/app-of-apps-test: "enabled"
spec:
  project: default

  source:
    repoURL: https://gitlab.com/DaxTheTax/platformforge.git
    targetRevision: main
    path: infrastructure/helm/platform-api
    helm:
      releaseName: platform-api
      valueFiles:
        - values-kind.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: platformforge

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
