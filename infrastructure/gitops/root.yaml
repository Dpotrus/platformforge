apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformforge-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://gitlab.com/DaxTheTax/platformforge.git
    targetRevision: main
    path: infrastructure/gitops/applications
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
