
services:
  postgres:
    image: postgres:17
    container_name: platformforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: platformforge
      POSTGRES_USER: platformforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U platformforge -d platformforge
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile

    image: platformforge-api:dev
    container_name: platformforge-api
    restart: unless-stopped

    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
