
services:
  postgres:
    image: postgres:17
    container_name: platformforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: platformforge
      POSTGRES_USER: platformforge
      POSTGRES_PASSWORD: platformforge_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U platformforge -d platformforge
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
