
services:
  postgres:
    image: postgres:17
    container_name: platformforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: platformforge
      POSTGRES_USER: platformforge
      POSTGRES_PASSWORD: platformforge_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U platformforge -d platformforge
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile

    image: platformforge-api:dev
    container_name: platformforge-api
    restart: unless-stopped

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://platformforge:platformforge_dev_password@postgres:5432/platformforge

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
