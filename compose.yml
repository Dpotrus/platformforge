
services:
  postgres:
    image: postgres:17
    container_name: platformforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: platformforge
      POSTGRES_USER: platformforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U platformforge -d platformforge
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile

    image: platformforge-api:dev
    container_name: platformforge-api
    restart: unless-stopped

    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: platformforge-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  grpc:
    build:
      context: ./services/platform-api
      dockerfile: Dockerfile

    image: platformforge-api:dev
    container_name: platformforge-grpc
    restart: unless-stopped

    command:
      - python
      - -m
      - app.grpc.server

    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      OTEL_TRACING_ENABLED: "true"
      OTEL_GRPC_SERVICE_NAME: platformforge-grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

    ports:
      - "127.0.0.1:50051:50051"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; channel = grpc.insecure_channel('127.0.0.1:50051'); stub = health_pb2_grpc.HealthStub(channel); response = stub.Check(health_pb2.HealthCheckRequest(service='platformforge.v1.ApplicationService'), timeout=3); assert response.status == health_pb2.HealthCheckResponse.SERVING; channel.close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  postgres_data:
