workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

    - if: '$CI_COMMIT_BRANCH'
      when: always

    - when: never

stages:
  - test
  - build

pytest:
  stage: test
  image: python:3.13-slim

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

  services:
    - name: postgres:17
      alias: postgres

  variables:
    POSTGRES_DB: platformforge_test
    POSTGRES_USER: platformforge
    POSTGRES_PASSWORD: ci_test_password
    DATABASE_URL: "postgresql+psycopg://platformforge:ci_test_password@postgres:5432/platformforge_test"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

  before_script:
    - cd services/platform-api
    - python -m pip install ".[dev]"
    - |
      python - <<'PY'
      import os
      import time
      import psycopg

      database_url = os.environ["DATABASE_URL"].replace(
          "postgresql+psycopg://",
          "postgresql://",
          1,
      )

      for attempt in range(30):
          try:
              with psycopg.connect(database_url, connect_timeout=2):
                  print("PostgreSQL is ready")
              break
          except psycopg.OperationalError:
              print(f"Waiting for PostgreSQL ({attempt + 1}/30)")
              time.sleep(2)
      else:
          raise SystemExit("PostgreSQL did not become ready")
      PY
  

  script:
    - python -m alembic upgrade head
    - python -m pytest -q --junitxml=test-results.xml

  artifacts:
    when: always
    reports:
      junit: services/platform-api/test-results.xml
    paths:
      - services/platform-api/test-results.xml
    expire_in: 7 days


docker-build:
  stage: build
  image: docker:27-cli

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - echo "Logging in to GitLab Container Registry"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - echo "Building PlatformForge API image"
    - docker build --tag "$CI_REGISTRY_IMAGE/platform-api:$CI_COMMIT_SHA" services/platform-api
    - docker image inspect "$CI_REGISTRY_IMAGE/platform-api:$CI_COMMIT_SHA"
    - echo "Pushing PlatformForge API image"
    - docker push "$CI_REGISTRY_IMAGE/platform-api:$CI_COMMIT_SHA"
