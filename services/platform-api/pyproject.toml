[project]
name = "platformforge-api"
version = "0.1.0"
description = "Internal Developer Platform API built with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.13,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["app"]