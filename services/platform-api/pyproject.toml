[project]
name = "platformforge-api"
version = "0.1.0"
description = "Internal Developer Platform API built with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2,<3",
    "prometheus-client>=0.21,<1.0",
    "grpcio>=1.70,<2.0",
    "protobuf>=6.31,<7.0",
    "opentelemetry-api>=1.45,<2.0",
    "opentelemetry-sdk>=1.45,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<1.0",
    "opentelemetry-instrumentation-grpc>=0.66b0,<1.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.13,<3.0",
    "grpcio-tools>=1.70,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "platformforge"]
